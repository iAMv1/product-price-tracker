<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Track mock-store prices over time: validated history, honest scrape logs, CSV export, every 2 hours."
    />
    <meta name="theme-color" content="#fafafa" />
    <meta property="og:title" content="Product Price Tracker" />
    <meta
      property="og:description"
      content="The store lies. The log doesn't. Honest price history with retries and failures visible."
    />
    <meta property="og:type" content="website" />
    <title>Product Price Tracker</title>
    <script>
      // Pre-paint theme: stored choice wins, otherwise the OS preference.
      // Mirrors the motionforge theme-toggle pattern (no flash of the wrong theme).
      try {
        var t = localStorage.getItem("theme");
        document.documentElement.dataset.theme =
          t === "light" || t === "dark"
            ? t
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
