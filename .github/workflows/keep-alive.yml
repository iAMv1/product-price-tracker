name: keep-alive
# Free-tier Render sleeps after ~15 min idle. When cron-job.org's 2h scrape
# fires at a cold instance, Render's load balancer answers with an HTML error
# page that exceeds cron-job.org's output limit ("Failed (output too large)")
# and the request never reaches the backend. Pinging /health every 5 minutes
# keeps the instance awake; scraping itself stays on cron-job.org
# (`0 */2 * * *`, POST /api/internal/scrape-all) as the assignment requires.
# Assignment note: "keep the instance warm if needed."
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render instance
        run: >
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors --max-time 90
          https://ppt-backend-lyiv.onrender.com/health
